[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vntts-artifacts"
version = "0.2.0"
description = "Versioned artifact contracts shared by VNTTS producers and consumers"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alex Redby" }]

[project.urls]
Repository = "https://github.com/AlexRedby/vntts-artifacts"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
